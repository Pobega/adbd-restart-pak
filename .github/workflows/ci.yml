name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: make lint SHELLCHECK=shellcheck
      - name: Build
        run: make zip

  # The Pak Store downloads {repo_url}/releases/download/{version}/{release_filename},
  # so the tag must match pak.json's version exactly.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches pak.json
        run: |
          version="$(jq -r .version pak.json)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match pak.json version $version"
            exit 1
          fi
      - name: Build
        run: make zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$(jq -r .release_filename pak.json)"
          cp "dist/Restart ADB.pak.zip" "$asset"
          jq -r --arg v "$GITHUB_REF_NAME" '.changelog[$v] // ""' pak.json >notes.md
          gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag
